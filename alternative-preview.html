<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alternative Preview - Resume Card</title>
    <style>
        /* Alternative: Modern Preview Card Approach */
        .resume-preview-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: 
                0 20px 60px rgba(30, 70, 160, 0.12),
                0 8px 20px rgba(30, 70, 160, 0.08);
            overflow: hidden;
            margin: var(--space-xl) 0;
            transition: all 0.3s ease;
        }

        .resume-preview-card:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 25px 80px rgba(30, 70, 160, 0.15),
                0 12px 30px rgba(30, 70, 160, 0.12);
        }

        .preview-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: var(--white);
            padding: var(--space-lg) var(--space-xl);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .preview-title {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            margin: 0;
        }

        .preview-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-medium);
        }

        .preview-content {
            padding: var(--space-xl);
            text-align: center;
        }

        .resume-thumbnail {
            width: 200px;
            height: 260px;
            background: var(--light-gray);
            border-radius: var(--radius-md);
            margin: 0 auto var(--space-lg);
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" fill="%23f0f0f0"><rect width="200" height="260" fill="%23ffffff"/><rect x="20" y="20" width="160" height="8" fill="%231e46a0"/><rect x="20" y="40" width="120" height="4" fill="%23666"/><rect x="20" y="60" width="160" height="2" fill="%23ccc"/><rect x="20" y="70" width="140" height="2" fill="%23ccc"/><rect x="20" y="80" width="100" height="2" fill="%23ccc"/></svg>');
            background-size: cover;
        }

        .resume-thumbnail:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .thumbnail-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(30, 70, 160, 0.9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s ease;
            border-radius: var(--radius-md);
        }

        .resume-thumbnail:hover .thumbnail-overlay {
            opacity: 1;
        }

        .preview-actions {
            display: flex;
            gap: var(--space-md);
            justify-content: center;
            margin-top: var(--space-lg);
        }

        .preview-btn {
            padding: var(--space-sm) var(--space-lg);
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: var(--font-weight-medium);
            font-size: var(--font-size-sm);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .preview-btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(30, 70, 160, 0.3);
        }

        .preview-btn-secondary {
            background: var(--white);
            color: var(--primary-color);
            border: 2px solid var(--accent-color);
        }

        .preview-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- Alternative approach: Replace the entire pdf-container with this -->
    <div class="resume-preview-card">
        <div class="preview-header">
            <h3 class="preview-title">📄 Resume Preview</h3>
            <span class="preview-badge">PDF</span>
        </div>
        <div class="preview-content">
            <div class="resume-thumbnail" onclick="window.open('Resume_Raghav-Gupta.pdf', '_blank')">
                <div class="thumbnail-overlay">
                    <span>👁️ View Full Resume</span>
                </div>
            </div>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">
                Click the thumbnail above to view the full resume in a new tab
            </p>
            <div class="preview-actions">
                <a href="Resume_Raghav-Gupta.pdf" class="preview-btn preview-btn-primary" target="_blank">
                    📖 View Resume
                </a>
                <a href="Resume_Raghav-Gupta.pdf" class="preview-btn preview-btn-secondary" download>
                    💾 Download PDF
                </a>
            </div>
        </div>
    </div>
</body>
</html>
